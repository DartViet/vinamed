  #  ports:
  #    - "80:80"
  #    - "443:443"
  #  volumes:
  #    - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #    - ./nginx/certs:/etc/nginx/certs
  #  depends_on:
  #    - fhir
  #    - pocketbase

configs:
  hapi:
     file: ./hapi.application.yaml

volumes:
  hapi-postgres-data:
  pocketbase_data: