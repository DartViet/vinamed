services:
  fhir:
    container_name: fhir
    image: "hapiproject/hapi:latest"
    hostname: hapifhir
    ports:
      - "8080:8080"
    configs:
      - source: hapi
        target: /app/config/application.yaml
    depends_on:
      - db


  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_DB: hapi
    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data


  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    container_name: pocketbase
    hostname: pocketbase.local
    ports:
      - "8081:8080"
    volumes:
      - pocketbase_data:/pb/pb_data
    restart: always


  #nginx:
  #  image: nginx:latest
