services:
  fhir:
    container_name: fhir
    image: "hapiproject/hapi:latest"
    hostname: hapifhir
    ports:
      - "8080:8080"
    configs:
      - source: hapi
        target: /app/config/application.yaml
    depends_on:
      - db


  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
      POSTGRES_DB: hapi
    volumes:
      - hapi-postgres-data:/var/lib/postgresql/data


  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    container_name: pocketbase
    hostname: pocketbase.local
    ports:
      - "8081:8080"
    volumes:
      - pocketbase_data:/pb/pb_data
    restart: always

  
  dart_webserver:
    build:
      context: .  # Build from monorepo root to access database_models package
      dockerfile: webserver/Dockerfile
    container_name: dart_webserver
    hostname: dartserver.local
    ports:
      - "8082:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - webserver_assets:/app/assets
    depends_on:
      - fhir
      - pocketbase


  #nginx:
  #  image: nginx:latest
  #  container_name: nginx
  #  ports:
  #    - "80:80"
  #    - "443:443"
  #  volumes:
  #    - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #    - ./nginx/certs:/etc/nginx/certs
  #  depends_on:
  #    - fhir
  #    - pocketbase

configs:
  hapi:
     file: ./hapi.application.yaml

volumes:
  hapi-postgres-data:
  pocketbase_data:
  webserver_assets: